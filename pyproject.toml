[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "alice-voice"
version = "0.1.0"
description = "Voice-specialized procedural codec - Don't send waveforms. Send the law of speech."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Moroya Sakamoto" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["voice", "codec", "lpc", "compression", "speech", "audio"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
    "maturin>=1.0",
]

[project.urls]
Homepage = "https://github.com/ext-sakamoro/ALICE-Voice"
Repository = "https://github.com/ext-sakamoro/ALICE-Voice"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "alice_voice.alice_voice"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
