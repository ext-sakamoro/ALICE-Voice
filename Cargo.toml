[package]
name = "alice-voice"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Voice-specialized procedural codec - Don't send waveforms. Send the law of speech."
license = "MIT"
repository = "https://github.com/ext-sakamoro/ALICE-Voice"
keywords = ["voice", "codec", "lpc", "procedural", "compression"]
categories = ["multimedia::audio", "compression", "encoding"]

[lib]
name = "alice_voice"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "python"]
std = []
python = ["pyo3", "numpy"]
no_std = []

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"

# Error handling
thiserror = "1.0"

# Parallel processing
rayon = "1.10"

# Python bindings (optional)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "codec_bench"
harness = false

# =============================================================================
# Release Profile - Maximum Performance
# =============================================================================
[profile.release]
lto = "fat"           # Full link-time optimization across all crates
codegen-units = 1     # Single codegen unit for best optimization
opt-level = 3         # Maximum optimization
panic = "abort"       # Smaller binary, no unwinding overhead
strip = true          # Strip symbols from binary

# Enable frame pointers for profiling (optional, comment out for max perf)
# debug = 1

# =============================================================================
# Bench Profile - Like release but with debug info
# =============================================================================
[profile.bench]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = true

# =============================================================================
# Target-specific optimizations
# =============================================================================
# See .cargo/config.toml for target-specific rustflags (NEON, AVX2, etc.)
