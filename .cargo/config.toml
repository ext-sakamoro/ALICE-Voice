# =============================================================================
# ALICE-Voice Build Configuration
# =============================================================================
# Target-specific SIMD optimizations for maximum performance

# ARM NEON (aarch64)
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+neon"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+neon"]

# ARM NEON (32-bit)
[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "target-feature=+neon"]

# x86_64 AVX2 + FMA (optional, may not work on older CPUs)
# Uncomment if targeting modern x86_64 CPUs
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-feature=+fma,+avx2"]

# [target.x86_64-apple-darwin]
# rustflags = ["-C", "target-feature=+fma,+avx2"]

# =============================================================================
# Build settings
# =============================================================================
[build]
# Uncomment to set default target
# target = "aarch64-apple-darwin"

# Use mold linker for faster builds (if available)
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
