name: CI

on:
  push:
    branches: [main, 'ci/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 builds the scalar backend; aarch64 builds NEON and runs the
        # scalar-vs-NEON bit-for-bit test (simd::tests::scalar_matches_arm_bit_for_bit)
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Voice

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-Voice

      - name: Build (default)
        working-directory: ALICE-Voice
        run: cargo build --lib

      # `python` (pyo3 extension-module) leaves libpython unlinked, so the test
      # binary is built without it
      - name: Test
        working-directory: ALICE-Voice
        run: cargo test --lib --no-default-features --features std

      # the bridges' own tests (their alice-* come by git, branch main)
      - name: Test the bridges
        working-directory: ALICE-Voice
        run: cargo test --lib --no-default-features --features std,ml,codec,db,text

      - name: Lock (every alice-* from git, none by path or from a registry, at most one alice-det-math)
        working-directory: ALICE-Voice
        run: |
          python3 - <<'PY'
          import sys, tomllib
          pk = [p for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"].startswith("alice")]
          bad = [f'{p["name"]} {p["version"]} {p.get("source", "path")}' for p in pk
                 if p["name"] != "alice-voice" and not p.get("source", "").startswith("git+")]
          dm = [p for p in pk if p["name"] == "alice-det-math"]
          print(f"lock: {len(pk) - 1} alice-* dependencies, {len(bad)} not from git, {len(dm)} alice-det-math")
          if len(pk) < 2 or bad or len(dm) > 1:
              sys.exit("\n".join(bad) or "expected an alice-* dependency and at most one alice-det-math")
          PY

      # Every optional feature on its own (read from Cargo.toml), so a bridge no other step builds cannot
      # break unseen
      - name: Test the feature check
        working-directory: ALICE-Voice
        run: python3 scripts/feature_check.py --self-test

      - name: Check each optional feature
        working-directory: ALICE-Voice
        run: python3 scripts/feature_check.py --ci

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

      # This crate must not depend on rkyv directly or archive anything through it
      # (scripts/no_direct_rkyv.py, kept byte-identical across repositories)
      - name: no-direct-rkyv guard (tests)
        run: python3 scripts/test_no_direct_rkyv.py
      - name: no-direct-rkyv guard
        run: python3 scripts/no_direct_rkyv.py

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

