[package]
name = "alice-voice"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Voice-specialized procedural codec - Don't send waveforms. Send the law of speech."
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Voice"
keywords = ["voice", "codec", "lpc", "procedural", "compression"]
categories = ["multimedia::audio", "compression", "encoding"]

[lib]
name = "alice_voice"
crate-type = ["rlib"]

[features]
default = ["std", "python"]
std = []
ffi = ["std"]     # C/C++/C# FFI bindings
python = ["pyo3", "numpy"]
ml = ["dep:alice-ml"]   # ALICE-ML ternary inference for voice parameters
codec = ["dep:alice-codec"]  # ALICE-Codec wavelet + rANS for parameter compression
# `alice-db/fs`: `AliceDB::open` (file-backed) is behind that feature in alice-db 0.5
db = ["dep:alice-db", "alice-db/fs"]   # ALICE-DB voice metrics persistence
text = ["dep:alice-text"]  # ALICE-Text compressed voice transcript metadata
no_std = []

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"

# Error handling
thiserror = "1.0"

# Parallel processing
rayon = "1.10"

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

# ML inference (optional)
alice-ml = { git = "https://github.com/ext-sakamoro/ALICE-ML", rev = "d2ce77f1f786d9777966a78d59ec289871f15a60", version = "0.4.0", optional = true, default-features = false, features = ["std"] }

# Codec bridge (optional)
alice-codec = { git = "https://github.com/ext-sakamoro/ALICE-Codec", rev = "c96278e27bcb5fd5bee9d6df7b3dc8ef4deba081", version = "0.1.3", optional = true, default-features = false, features = ["std"] }

# DB bridge (optional)
alice-db = { version = "0.5", optional = true, default-features = false }

# Text bridge (optional)
alice-text = { path = "../ALICE-Text", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "codec_bench"
harness = false

# =============================================================================
# Release Profile - Maximum Performance
# =============================================================================
[profile.release]
lto = "fat"           # Full link-time optimization across all crates
codegen-units = 1     # Single codegen unit for best optimization
opt-level = 3         # Maximum optimization
panic = "abort"       # Smaller binary, no unwinding overhead
strip = true          # Strip symbols from binary

# Enable frame pointers for profiling (optional, comment out for max perf)
# debug = 1

# =============================================================================
# Bench Profile - Like release but with debug info
# =============================================================================
[profile.bench]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = true

# =============================================================================
# Target-specific optimizations
# =============================================================================
# See .cargo/config.toml for target-specific rustflags (NEON, AVX2, etc.)
